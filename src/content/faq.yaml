# Frequently asked questions. `home: true` shows the question on the homepage too.
# topic: product | application | ordering | science | organic
- id: what-is-humusolver
  order: 1
  topic: product
  home: true
  q: What is Humusolver?
  a: Humusolver is a humic and fulvic acid concentrate made from natural humate deposits mined in northwest New Mexico. It comes as a water-soluble powder (Humusolver-100) and as a granule that blends with dry fertilizer (FS Granular).
- id: replace-fertilizer
  order: 2
  topic: science
  home: true
  q: Does Humusolver replace fertilizer?
  a: "No. It makes your fertilizer work harder. Research shows humic acid improves nitrogen use efficiency by 27% on average, so more of what you apply ends up in the crop. It's not a significant source of nitrogen, phosphorus, or potassium itself. [[LABEL CHECK: guaranteed analysis]]"
- id: which-product
  order: 3
  topic: product
  home: true
  q: Which product should I use?
  a: Use Humusolver-100 for anything that goes through water, like row starters, sprayers, injectors, irrigation, greenhouses, and hydroponics. Use FS Granular to blend with dry fertilizer for broadcasting. Not sure? Call us or choose "Not sure" on the quote form.
- id: how-much
  order: 4
  topic: application
  q: How much do I need per acre?
  a: General rates are 5–10 lb per acre of Humusolver-100 for ground application, 1–2 lb per acre in a row starter, and 5–20 lb per acre of FS Granular broadcast. The quote page has an estimator that turns your acres into pounds and bags.
- id: results
  order: 5
  topic: science
  home: true
  q: Will I see a yield increase?
  a: "Research on humic substances is encouraging. A 2024 meta-analysis of field studies found 12% higher yields on average, and USDA-ARS trials in Iowa corn measured yield gains of 1–4% in every replicated site-year, and up to 19% on drought-stressed ground. Every field is different, so the best proof is a strip trial on your own ground. We're confident you'll see the difference."
- id: organic
  order: 6
  topic: organic
  home: true
  q: Can I use Humusolver on certified organic ground?
  a: "Humusolver-100 has been OMRI Listed for organic production. [[OWNER CONFIRM: current OMRI listing (old certificate expired June 1, 2026) and status of FS Granular]] Always check with your certifier before applying any input."
- id: tank-mix
  order: 7
  topic: application
  q: Can I tank-mix Humusolver-100?
  a: "Growers commonly apply humic products with liquid fertilizers and other spray partners. Always do a jar test with your exact mix before filling the tank. [[OWNER CONFIRM: any known incompatible tank partners]]"
- id: storage
  order: 8
  topic: product
  q: How do I store it, and does it expire?
  a: "Store in a closed container in a dry place. As a dry product it stores well long-term. [[LABEL CHECK: shelf-life statement]]"
